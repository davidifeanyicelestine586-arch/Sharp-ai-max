name: CI

on:
  push:
    branches: [main, "hardening/**", "docs/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Inspect dependency lock entries
        run: node -e "const l=require('./package-lock.json'); console.log(JSON.stringify({root:l.packages[''],react:l.packages['node_modules/@types/react'],reactDom:l.packages['node_modules/@types/react-dom'],csstype:l.packages['node_modules/csstype']},null,2))"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
