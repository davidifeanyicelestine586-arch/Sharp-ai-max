name: CI

on:
  push:
    branches: [main, "hardening/**", "docs/**", "security/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/security/dependency-hardening'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/security/dependency-hardening'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): synchronize dependency lockfile"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
